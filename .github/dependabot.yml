# Updates of the site's tools arrive as pull requests, checked by the same CI as any change.
# Monthly and grouped, so the shared runner pool sees one or two runs a month, not one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      other-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
