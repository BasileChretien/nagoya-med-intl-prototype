name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild every Monday 10:00 JST, so lists that depend on the date (upcoming events, passed calls) move on
  # even when nothing was committed. A passed deadline still marked open stops this deploy like any other.
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is set per job: a newer run cancels an older build, and a newer deploy an older one, but nothing
# cancels a record-editor-sync job.

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The editor step below walks back to the last record commit (scripts/editor-confirm.mjs, LOOK_BACK).
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A save from the editing page (public/admin/, message starting with "[editor]") changes one language at a time,
      # and office staff cannot run "npm run sync -- confirm". On every run on main, record as in step what the editor
      # saves since the last record commit changed, whatever the last commit is, so a save is never lost when a
      # developer push, the Monday run or a later save cancels its run. The record-editor-sync job commits the record.
      # Developer changes keep the strict rule (scripts/editor-lib.mjs).
      - name: Record editor saves as in step in both languages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/editor-confirm.mjs
      - name: Check content sources
        run: node scripts/check-content.mjs
      - name: Test the content checks
        run: node scripts/test-checks.mjs
      - name: Check that no version is stale
        run: node scripts/check-staleness.mjs
      - name: Test the staleness checks
        run: node scripts/test-staleness.mjs
      - name: Test the content-page plugin
        run: node scripts/test-content-plugin.mjs
      - name: Test the weekly check and the structured-data check
        run: node scripts/test-tools.mjs
      - name: Test the editor's confirmation and configuration
        run: node scripts/test-editor.mjs
      - name: Type check
        run: npx astro check
      - run: npm run build
      - name: Check internal links in the built site
        run: node scripts/check-content.mjs --dist
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Commits the record of pending editor saves to main, so the next run starts from it. It records from the newest main,
  # so saves that arrived after this run started are included. A separate job, so the build job (which also runs pull
  # request code) never holds a token that can write to the repository; its own group, never cancelled, so two record
  # jobs never push at once and a newer run does not stop one half-way.
  record-editor-sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: editor-record-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record pending editor saves and commit the record to main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # When main moves on during the job, start again from the new main (the record is recomputed, not rebased).
          for attempt in 1 2 3; do
            git fetch --depth=50 origin main
            git reset --hard origin/main
            node scripts/editor-confirm.mjs
            git add content-sync.json faculty
            if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
            git commit -m "$(node scripts/editor-confirm.mjs --record-message)"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved on; recording again from the new main"
          done
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
