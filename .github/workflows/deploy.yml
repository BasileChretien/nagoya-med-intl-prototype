name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild every Monday 10:00 JST, so lists that depend on the date (upcoming events, passed calls) move on
  # even when nothing was committed. A passed deadline still marked open stops this deploy like any other.
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check content sources
        run: node scripts/check-content.mjs
      - name: Test the content checks
        run: node scripts/test-checks.mjs
      - name: Check that no version is stale
        run: node scripts/check-staleness.mjs
      - name: Test the staleness checks
        run: node scripts/test-staleness.mjs
      - name: Test the content-page plugin
        run: node scripts/test-content-plugin.mjs
      - name: Test the weekly check and the structured-data check
        run: node scripts/test-tools.mjs
      - name: Type check
        run: npx astro check
      - run: npm run build
      - name: Check internal links in the built site
        run: node scripts/check-content.mjs --dist
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
