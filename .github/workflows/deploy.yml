name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild every Monday 10:00 JST, so lists that depend on the date (upcoming events, passed calls) move on
  # even when nothing was committed. A passed deadline still marked open stops this deploy like any other.
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The editor step below compares each editor save with the commit before it (scripts/editor-confirm.mjs).
          fetch-depth: 30
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A save from the editing page (public/admin/, message starting with "[editor]") changes one language at a time,
      # and office staff cannot run "npm run sync -- confirm". For those saves only, record the pages and fields of
      # the files the saves changed as in step, so the checks below let them through; the record-editor-sync job
      # commits the record after a successful build. Developer commits keep the strict rule.
      - name: Record an editor save as in step in both languages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[editor]')
        run: node scripts/editor-confirm.mjs
      - name: Check content sources
        run: node scripts/check-content.mjs
      - name: Test the content checks
        run: node scripts/test-checks.mjs
      - name: Check that no version is stale
        run: node scripts/check-staleness.mjs
      - name: Test the staleness checks
        run: node scripts/test-staleness.mjs
      - name: Test the content-page plugin
        run: node scripts/test-content-plugin.mjs
      - name: Test the weekly check and the structured-data check
        run: node scripts/test-tools.mjs
      - name: Test the editor's confirmation and configuration
        run: node scripts/test-editor.mjs
      - name: Type check
        run: npx astro check
      - run: npm run build
      - name: Check internal links in the built site
        run: node scripts/check-content.mjs --dist
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Commits the record made by the editor step to main, so the next build starts from it. A separate job, so the build
  # job (which also runs pull request code) never holds a token that can write to the repository.
  record-editor-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[editor]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Same script and same commits as in the build job: the record is the one the checks passed with.
      - run: node scripts/editor-confirm.mjs
      - name: Commit the record to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-sync.json faculty
          if git diff --cached --quiet; then echo "Nothing new to record."; exit 0; fi
          git commit -m "chore: record both languages as in step after an editor save [skip ci]"
          # Another save may have reached main meanwhile: rebase on it and try once more.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
