# Feature map: one entry per promise to the visitor or the editor.
# Redraw the picture with: node scripts/draw-features.mjs  (writes docs/features.md)
features:
  - id: audience-sections
    says: Visitors find content by what they want to do, in five sections, with home-page entries for prospective partners, companies, Nagoya faculty, parents and the press.
    stage: Find
    status: works
    delivered_by: [src/components/Header.astro, src/pages/[lang]/[...slug].astro]
    tests: [pairing]
    docs: CONTENT_GUIDE.md
  - id: bilingual-pairs
    says: Every page exists in English and Japanese, and the language switch opens the same page in the other language.
    stage: Find
    status: works
    delivered_by: [src/layouts/Base.astro, src/components/Header.astro]
    tests: [pairing]
    docs: CONTENT_GUIDE.md
  - id: programme-facts
    says: Each programme's key facts appear in a box on its page, from one data file.
    stage: Decide
    status: works
    delivered_by: [src/components/FactBox.astro, src/data/programmes]
    tests: [programme-references]
    docs: CONTENT_GUIDE.md
  - id: compare-programmes
    says: Visitors can compare programmes side by side, including the English test and scores each one requires.
    stage: Decide
    status: works
    delivered_by: [src/pages/[lang]/programmes/index.astro, src/components/CompareTable.astro]
    tests: [programme-references]
  - id: key-dates
    says: The home page lists deadlines, and never shows a passed deadline as open.
    stage: Decide
    status: works
    delivered_by: [src/components/DeadlineList.astro, src/pages/[lang]/index.astro]
    tests: [deadlines]
  - id: story-library
    says: Visitors can filter student stories by type, country and year, share or link a filtered list by its address, and open the full report; the Japanese list opens on Nagoya students abroad.
    stage: Explore
    status: works
    delivered_by: [src/pages/[lang]/stories/index.astro, src/components/StoryCard.astro, src/data/stories.json]
    tests: [data-files]
  - id: report-pages
    says: Every student report has its own page in English and Japanese; the version that is not the original is an automatic translation, labelled as such, with a link to the original.
    stage: Explore
    status: works
    delivered_by: [src/pages/[lang]/stories/[id].astro, src/lib/reports.ts, src/data/reports]
    tests: [report-translations]
    limits: Translations are automatic (AI) and have not been checked by a person.
  - id: photos
    says: Pages, reports and the team list show photos, each with a description in both languages for screen readers.
    stage: Explore
    status: works
    delivered_by: [src/components/Photo.astro, src/data/images.json]
    tests: [photo-descriptions, images]
  - id: news
    says: Every news item has its own page in both languages; the list can be filtered by type and partner, and past events and closed calls are labelled.
    stage: Explore
    status: works
    delivered_by: [src/pages/[lang]/news/index.astro, src/pages/[lang]/news/[id].astro, src/pages/[lang]/news/_news.ts, src/data/news.json]
    tests: [data-files]
  - id: partners-contacts
    says: Partner universities and contact points come from data files and stay consistent everywhere; the partner list can be searched and filtered by region and link, with counts, and opened on one filter from another page.
    stage: Contact
    status: works
    delivered_by: [src/pages/[lang]/[...slug].astro, src/data/partners.json, src/data/contacts.json]
    tests: [data-files]
  - id: office-access
    says: Visitors find the office's building, floor and room, step-by-step directions from Tsurumai Station, a route map and the printable route guide.
    stage: Contact
    status: works
    delivered_by: [src/content/pages/en/about/access.md, src/content/pages/ja/about/access.md, public/files/route-map-en.pdf, public/files/route-map-ja.pdf, src/data/contacts.json]
    tests: [pairing, images, internal-links]
  - id: acronyms-explained
    says: Every abbreviation says what it stands for where it is first used on a page, with a list at the end of the page, links to the institutions, and a full list of abbreviations; links to pages in the other language or to PDFs say so.
    stage: Explore
    status: works
    delivered_by: [src/lib/rehype-abbr.mjs, src/data/glossary.json, src/content/pages/en/about/glossary.md, src/content/pages/ja/about/glossary.md]
    tests: [acronyms, content-plugin]
    limits: Abbreviations in texts drawn from the data files (programme boxes, partner names, news) are listed on the abbreviations page but not marked where they appear.
  - id: japanese-only-summaries
    says: When an English page links to a page that exists only in Japanese, an English summary of that page, marked as written automatically, opens under the link.
    stage: Explore
    status: works
    delivered_by: [src/lib/rehype-abbr.mjs, src/data/ja-summaries.json]
    tests: [ja-summaries, content-plugin]
    docs: CONTENT_GUIDE.md
    limits: Summaries are checked against the page on the date they were written; the weekly check reports a broken link but not a changed page. PDF files are not required to have one.
  - id: faculty-links
    says: The site shows where it sits in the faculty website and sends visitors to the faculty's directory entry for the team, research and publications.
    stage: Contact
    status: works
    delivered_by: [src/components/Header.astro, src/components/Footer.astro, src/data/faculty.json]
    tests: [internal-links, faculty-texts]
  - id: versions-in-step
    says: No English or Japanese version of a page, fact, photo description or report translation can fall behind the other without the check failing.
    stage: Maintain
    status: works
    delivered_by: [scripts/check-staleness.mjs, scripts/staleness-report.mjs, scripts/staleness-lib.mjs, scripts/sync.mjs, content-sync.json]
    tests: [versions-in-step, facts-match, translations-current]
  - id: faculty-layer
    says: The texts for the faculty website are generated from the site's data, and a weekly check compares the live faculty pages with the site.
    stage: Maintain
    status: works
    delivered_by: [scripts/build-faculty-texts.mjs, faculty, scripts/check-faculty-live.mjs, scripts/faculty-live-lib.mjs, .github/workflows/faculty-drift.yml]
    tests: [faculty-texts, faculty-live]
    limits: The International section rule stays pending until the faculty's web team publishes the gateway texts. Problems the faculty has not fixed yet are listed as known gaps (faculty.json knownGaps) until they are.
  - id: content-status
    says: Editors see every fact that still needs confirming on one checklist page; public pages show only a one-line pointer to it.
    stage: Maintain
    status: works
    delivered_by: [src/components/PageNotes.astro, src/pages/[lang]/status/index.astro]
    tests: [data-files]
  - id: browser-editing
    says: Office staff can edit in the browser and record that both languages are in step from the Actions tab, with nothing to install.
    stage: Maintain
    status: works
    delivered_by: [.github/workflows/confirm.yml, CONTENT_GUIDE.md]
    tests: [versions-in-step]
    limits: Commits made by the workflow do not start the pull request's checks again; the workflow runs the content and staleness checks itself.
  - id: automatic-checks
    says: Every change is checked for missing translations, passed deadlines, large images and broken internal links before it is published.
    stage: Maintain
    status: works
    delivered_by: [scripts/check-content.mjs, .github/workflows/deploy.yml]
    tests: [pairing, deadlines, images, internal-links]
  - id: weekly-check
    says: Every Monday the site is rebuilt and checked for broken outside links and deadlines to update, and anything found is reported in one issue for the office.
    stage: Maintain
    status: works
    delivered_by: [.github/workflows/weekly-check.yml, scripts/weekly-check.mjs, scripts/external-lib.mjs, .github/workflows/deploy.yml]
    tests: [weekly-check, deadlines]
    limits: Sites that refuse automated checks are listed in the run summary, not in the issue. GitHub pauses scheduled workflows after 60 days without a commit to the repository.
  - id: tool-updates
    says: Updates of the site's tools arrive once a month as pull requests, checked like any other change.
    stage: Maintain
    status: partial
    delivered_by: [.github/dependabot.yml]
    limits: Security alerts and security updates are switched on in the repository's settings, not in this file.
  - id: search-hidden
    says: The prototype stays out of search engines so it never competes with the official sites.
    stage: Maintain
    status: works
    delivered_by: [src/lib/launch.mjs, src/layouts/Base.astro, src/pages/robots.txt.ts]
    tests: [noindex]
    limits: One switch (src/lib/launch.mjs) turns it off at launch, with the other steps in docs/launch.md.
  - id: findable-at-launch
    says: Search engines get a sitemap with both languages and structured data for the office, each page's place in the site and each programme, ready to be announced at launch.
    stage: Find
    status: works
    delivered_by: [astro.config.mjs, src/lib/structured.ts, src/pages/robots.txt.ts]
    tests: [sitemap, structured-data]
    docs: docs/launch.md
    limits: Events are not described as events, because the news data has no place for them. robots.txt counts only at the root of a host; under /intlexch/ the faculty adds the sitemap line to its own.
  - id: privacy-accessibility
    says: Visitors can read what the site records about them and how it is made accessible, and how to report a problem.
    stage: Find
    status: partial
    delivered_by: [src/content/pages/en/about/privacy.md, src/content/pages/en/about/accessibility.md, src/components/Footer.astro]
    tests: [pairing]
    limits: Both pages describe the prototype. The statements for the launched site, the accessibility target and any measurement of visits are to be agreed with the faculty (docs/launch.md).
